    <script>
      // Ensure window.fetch has a setter so runtime wrapper scripts can assign to it without throwing
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(fn) { _f = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
